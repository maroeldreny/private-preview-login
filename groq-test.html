<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>اختبار Groq خاص</title><style>body{font:18px system-ui;background:#f7f3ec;color:#241c1b;margin:0;display:grid;min-height:100dvh;place-items:center}main{padding:30px;max-width:380px}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:14px;font:inherit;border:1px solid #aaa;border-radius:12px}button{background:#b62229;color:white;cursor:pointer}p{line-height:1.7}small{display:block;color:#666}</style></head><body><main><h1>اختبار Groq خاص</h1><p>اكتب كلمة الدخول لفتح النسخة التجريبية.</p><form><input type="password" autocomplete="current-password" required aria-label="كلمة الدخول"><button>افتح التجربة</button></form><p id="error" role="alert"></p><small>الصفحة دي مش مرتبطة بالموقع الأساسي.</small></main><script>
const endpoint='https://waglkntvbnvtqwtnaqew.supabase.co/functions/v1/groq-stage';
document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;document.querySelector('#error').textContent='جاري فتح التجربة...';try{const r=await fetch(endpoint+'/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر فتح التجربة');const parsed=new DOMParser().parseFromString(d.html,'text/html');parsed.querySelectorAll('link[rel=stylesheet],script').forEach(x=>x.remove());document.open();document.write('<!doctype html>'+parsed.documentElement.outerHTML);document.close();window.TRIAL_ENDPOINT=endpoint;window.TRIAL_TOKEN=d.token;const style=document.createElement('style');style.textContent=d.css;document.head.append(style);const script=document.createElement('script');script.textContent=d.js;document.body.append(script)}catch(err){document.querySelector('#error').textContent=err.message;b.disabled=false}});
</script></body></html>
